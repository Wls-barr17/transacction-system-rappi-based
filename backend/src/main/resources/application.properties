server.port=${PORT:8080}
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.sql.init.mode=never
domiflow.jwt.secret=${JWT_SECRET}
domiflow.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
domiflow.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
